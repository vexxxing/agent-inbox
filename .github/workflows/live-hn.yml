# Live test 2: poll Hacker News's public newest-stories list and post one
# event when a story newer than the starting one appears. No key or account.
name: Live test hn

on:
  push:
    branches: [live-test]
    paths: [".live/hn"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  hn:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Watch for a new story
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INBOX_PR: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from agent_inbox import event as ev
          from agent_inbox.github import GitHub

          API = "https://hacker-news.firebaseio.com/v0"
          def get(path):
              with urllib.request.urlopen(f"{API}/{path}", timeout=20) as r:
                  return json.load(r)

          start = max(get("newstories.json"))
          print("starting newest id", start)
          deadline = time.time() + 6 * 60
          while time.time() < deadline:
              time.sleep(25)
              newer = [i for i in get("newstories.json") if i > start]
              if not newer:
                  print("nothing new yet")
                  continue
              item = get(f"item/{min(newer)}.json")
              seen = int(time.time())
              payload = {"hn_id": item["id"],
                         "story_time": item.get("time"),
                         "seen_time": seen,
                         "link": f"https://news.ycombinator.com/item?id={item['id']}"}
              e = ev.make_event("hn.new_story", "live-test", payload,
                                id=f"hn-{item['id']}")
              GitHub.from_env().post_event(e)
              print("posted", json.dumps(payload))
              break
          else:
              print("no new story within 6 minutes")
              raise SystemExit(1)
          PY
